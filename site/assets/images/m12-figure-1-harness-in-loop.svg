<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#27465f"/></marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5541f"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#132338">Where the harness sits in the loop: first check after every generation, before the judge</text>

  <!-- start -->
  <circle cx="40" cy="240" r="9" fill="#27465f"/>
  <text x="40" y="270" text-anchor="middle" font-size="13" fill="#27465f">goal +</text>
  <text x="40" y="285" text-anchor="middle" font-size="13" fill="#27465f">spec</text>
  <line x1="49" y1="240" x2="88" y2="240" stroke="#27465f" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- nodes -->
  <g stroke="#27465f" stroke-width="2.5">
    <rect x="90" y="200" width="180" height="80" rx="12" fill="#dff1f7"/>
    <rect x="350" y="200" width="180" height="80" rx="12" fill="#ffe08a" stroke="#c98a00" stroke-width="6"/>
    <rect x="610" y="200" width="180" height="80" rx="12" fill="#e7f0d9"/>
    <polygon points="905,185 980,240 905,295 830,240" fill="#fff0c9"/>
    <rect x="1040" y="210" width="130" height="60" rx="12" fill="#cfeedd"/>
    <rect x="810" y="400" width="190" height="80" rx="12" fill="#fde2d0" stroke="#b5541f"/>
  </g>
  <g text-anchor="middle" fill="#132338">
    <text x="180" y="233" font-size="18" font-weight="700">Generate</text>
    <text x="180" y="256" font-size="13">model writes the artifact</text>
    <text x="440" y="233" font-size="18" font-weight="700">Harness</text>
    <text x="440" y="256" font-size="13">tests + static rules</text>
    <text x="440" y="274" font-size="11">read-only copy of the checks</text>
    <text x="700" y="233" font-size="18" font-weight="700">Judge</text>
    <text x="700" y="256" font-size="13">typed yes/no probabilities</text>
    <text x="905" y="236" font-size="16" font-weight="700">Decide</text>
    <text x="905" y="256" font-size="12">thresholds in code</text>
    <text x="1105" y="246" font-size="17" font-weight="700">Accepted</text>
    <text x="905" y="433" font-size="18" font-weight="700">Human</text>
    <text x="905" y="456" font-size="13">approve · stop · feedback</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#27465f" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="270" y1="240" x2="348" y2="240"/>
    <line x1="530" y1="240" x2="608" y2="240"/>
    <line x1="790" y1="240" x2="828" y2="240"/>
    <line x1="980" y1="240" x2="1038" y2="240"/>
    <line x1="905" y1="295" x2="905" y2="398"/>
    <path d="M1000,440 H1105 V272"/>
  </g>
  <g font-size="13" fill="#27465f" text-anchor="middle">
    <text x="569" y="231">pass</text>
    <text x="1009" y="229">accept</text>
    <text x="1052" y="432">approve</text>
  </g>
  <text x="912" y="345" font-size="13" fill="#27465f">uncertain, or budget exhausted</text>


  <!-- harness callouts -->
  <g>
    <rect x="285" y="128" width="310" height="52" rx="10" fill="#fff6d6" stroke="#c98a00" stroke-width="2"/>
    <text x="440" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#132338">Runs first, with no model call</text>
    <text x="440" y="169" text-anchor="middle" font-size="12" fill="#132338">deterministic: milliseconds to seconds, same result every time</text>
    <line x1="440" y1="180" x2="440" y2="198" stroke="#c98a00" stroke-width="3" marker-end="url(#a)"/>
    <rect x="590" y="300" width="220" height="62" rx="10" fill="#f2f5f9" stroke="#27465f" stroke-width="2"/>
    <text x="700" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#132338">Judge: only after a pass</text>
    <text x="700" y="342" text-anchor="middle" font-size="12" fill="#132338">costs a model call, so it sees only</text>
    <text x="700" y="356" text-anchor="middle" font-size="12" fill="#132338">what the harness already accepted</text>
    <line x1="700" y1="300" x2="700" y2="283" stroke="#27465f" stroke-width="2" marker-end="url(#a)"/>
    <text x="40" y="200" text-anchor="middle" font-size="12" fill="#4b5d73"></text>
  </g>

  <!-- feedback arrows -->
  <g stroke="#b5541f" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#f)">
    <path d="M905,185 V120 H180 V198"/>
    <path d="M440,280 V340 H165 V282"/>
    <path d="M810,440 H115 V282"/>
  </g>
  <g font-size="13" fill="#b5541f" text-anchor="middle">
    <text x="545" y="112">revise: judge findings become feedback</text>
    <text x="300" y="358">fail: test output becomes feedback</text>
    <text x="460" y="468">feedback from the person (extends the budget)</text>
  </g>

  <!-- trace markers on every node -->
  <g fill="#6b4fa3" stroke="#ffffff" stroke-width="2">
    <circle cx="262" cy="208" r="9"/><circle cx="522" cy="208" r="9"/><circle cx="782" cy="208" r="9"/>
    <circle cx="992" cy="408" r="9"/>
  </g>

  <!-- state strip and tracer -->
  <rect x="90" y="515" width="520" height="84" rx="12" fill="#f2f5f9" stroke="#27465f" stroke-width="2"/>
  <text x="350" y="543" text-anchor="middle" font-size="15" font-weight="700" fill="#132338">Loop state (typed, checkpointed after every node)</text>
  <text x="350" y="568" text-anchor="middle" font-size="13" fill="#132338">spec · code · feedback · iteration / max_iters · status · cost</text>
  <text x="350" y="589" text-anchor="middle" font-size="12" fill="#4b5d73">harness first (cheap, deterministic), then judge, then a person</text>
  <rect x="640" y="515" width="510" height="84" rx="12" fill="#efe9f8" stroke="#6b4fa3" stroke-width="2"/>
  <circle cx="662" cy="543" r="8" fill="#6b4fa3"/>
  <text x="680" y="548" font-size="15" font-weight="700" fill="#132338">Tracer: documents the run</text>
  <text x="895" y="568" text-anchor="middle" font-size="13" fill="#132338">one record per node: generate, harness, judge, human</text>
  <text x="895" y="589" text-anchor="middle" font-size="12" fill="#4b5d73">result, feedback, cost, time: dots mark the recorded nodes</text>

</svg>
