<text x="500" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#132338">Planner-executor</text>
<rect x="20" y="150" width="130" height="70" rx="12" fill="#fff0c9" stroke="#27465f" stroke-width="2.5"/><text x="85.0" y="190.0" text-anchor="middle" font-size="16" font-weight="700" fill="#132338">Goal</text><rect x="210" y="150" width="150" height="70" rx="12" fill="#dff1f7" stroke="#27465f" stroke-width="2.5"/><text x="285.0" y="181.0" text-anchor="middle" font-size="16" font-weight="700" fill="#132338">Planner</text><text x="285.0" y="201.0" text-anchor="middle" font-size="12.5" fill="#132338">writes ordered steps</text><rect x="420" y="100" width="160" height="50" rx="12" fill="#e7f0d9" stroke="#27465f" stroke-width="2.5"/><text x="500.0" y="130.0" text-anchor="middle" font-size="16" font-weight="700" fill="#132338">Step 1</text><rect x="420" y="170" width="160" height="50" rx="12" fill="#e7f0d9" stroke="#27465f" stroke-width="2.5"/><text x="500.0" y="200.0" text-anchor="middle" font-size="16" font-weight="700" fill="#132338">Step 2</text><rect x="420" y="240" width="160" height="50" rx="12" fill="#e7f0d9" stroke="#27465f" stroke-width="2.5"/><text x="500.0" y="270.0" text-anchor="middle" font-size="16" font-weight="700" fill="#132338">Step 3</text><rect x="640" y="150" width="150" height="70" rx="12" fill="#e7f0d9" stroke="#27465f" stroke-width="2.5"/><text x="715.0" y="181.0" text-anchor="middle" font-size="16" font-weight="700" fill="#132338">Executor</text><text x="715.0" y="201.0" text-anchor="middle" font-size="12.5" fill="#132338">runs one step at a time</text><rect x="850" y="150" width="130" height="70" rx="12" fill="#cfeedd" stroke="#27465f" stroke-width="2.5"/><text x="915.0" y="190.0" text-anchor="middle" font-size="16" font-weight="700" fill="#132338">Result</text><line x1="150" y1="185" x2="208" y2="185" stroke="#27465f" stroke-width="2.5" marker-end="url(#a)"/><line x1="360" y1="185" x2="418" y2="185" stroke="#27465f" stroke-width="2.5" marker-end="url(#a)"/><line x1="580" y1="125" x2="638" y2="170" stroke="#27465f" stroke-width="2.5" marker-end="url(#a)"/><line x1="580" y1="195" x2="638" y2="185" stroke="#27465f" stroke-width="2.5" marker-end="url(#a)"/><line x1="580" y1="265" x2="638" y2="200" stroke="#27465f" stroke-width="2.5" marker-end="url(#a)"/><line x1="790" y1="185" x2="848" y2="185" stroke="#27465f" stroke-width="2.5" marker-end="url(#a)"/><path d="M715,222 C715,330 285,330 285,222" fill="none" stroke="#b5541f" stroke-width="2.5" marker-end="url(#f)" stroke-dasharray="7 5"/><text x="500" y="345" text-anchor="middle" font-size="13" font-style="italic" fill="#b5541f">step result unexpected → replan</text><text x="500" y="305" text-anchor="middle" font-size="13" font-style="italic" fill="#27465f">plan is a visible artifact: reviewable and editable before execution</text></svg>
